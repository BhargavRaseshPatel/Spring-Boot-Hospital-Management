# Demo profile: in-memory H2, so the public deployment has no database to provision,
# pay for, or watch expire. Data resets on every restart, which is what a demo wants.
# Run with: --spring.profiles.active=demo
spring.datasource.url=jdbc:h2:mem:hospital;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Quiet in a deployed environment — the SQL logging is a local debugging aid.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
