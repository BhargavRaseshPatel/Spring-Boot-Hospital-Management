spring.application.name=hospitalManagement

# DB configuration (hospital_management is the database name)
spring.datasource.url=jdbc:postgresql://localhost:5432/hospital_management
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# create: rebuilds the schema at startup, but leaves it in place after shutdown so you can inspect it
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
server.port=${PORT:9090}