spring.application.name=hospitalManagement

# No datasource is configured here on purpose.
#
# There is deliberately NO localhost fallback: a fallback silently connects to whatever stale
# local database exists and looks exactly like "the data came from data.sql". Missing config
# should fail loudly instead.
#
# Supply the connection in one of two places (both outrank this file):
#   local  -> config/application.properties  (gitignored, read automatically from ./config/)
#   deploy -> SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD environment variables

# Non-destructive by default: keep the existing schema and every row in it.
# `create` would drop and rebuild every table on each startup.
# ponytail: ddl-auto=update, move to Flyway when a column needs renaming or backfilling.
spring.jpa.hibernate.ddl-auto=update

# data.sql is opt-in. Run with SPRING_SQL_INIT_MODE=always to seed an empty database once;
# leaving it on re-inserts the seed rows and fails the unique email constraint.
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:data.sql

# Set SPRING_JPA_SHOW_SQL=true to count queries (see docs/n-plus-one.md).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:9090}
