services:
  - type: web
    name: hospital-management
    runtime: docker
    plan: free
    healthCheckPath: /api/doctors
    envVars:
      # Render injects PORT; application.properties already reads ${PORT:9090}.
      - key: PORT
        value: 10000
      # Neon connection. Set these in the Render dashboard — sync:false keeps them out of git.
      # All three are required: without them the app fails to start rather than falling back.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
